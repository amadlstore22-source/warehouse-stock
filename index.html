<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#0c0f14" />
<title>Warehouse Stock Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Industrial logistics terminal — slate, signal lights, hazard amber */
    --bg: #0c0f14; --bg2: #10141b;
    --card: #161b23; --card2: #1b212b;
    --line: #2a323f; --line2: #353f4f;
    --text: #eef2f6; --muted: #8b95a4; --faint: #5f6b7a;
    --in: #1fd36a; --in-deep: #0d5e30; --in-glow: rgba(31,211,106,.28);
    --out: #ff5247; --out-deep: #7e201c; --out-glow: rgba(255,82,71,.30);
    --amber: #ffb020; --amber-deep: #5a3d05;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--text);
    font-family: 'Archivo', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,176,32,.06), transparent 60%),
      linear-gradient(transparent 0, transparent 31px, rgba(255,255,255,.018) 32px),
      linear-gradient(90deg, transparent 0, transparent 31px, rgba(255,255,255,.018) 32px),
      var(--bg);
    background-size: auto, 32px 32px, 32px 32px, auto;
    padding: 18px 16px 90px; max-width: 560px; margin: 0 auto; min-height: 100vh;
  }
  ::selection { background: var(--amber); color: #1a1205; }

  /* ---- Header ---- */
  h1 {
    font-size: 22px; font-weight: 900; letter-spacing: -.02em;
    margin: 2px 0 18px; display: flex; align-items: center; gap: 10px;
    text-transform: uppercase;
  }
  h1::after {
    content: 'STOCK CONTROL';
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: .22em; color: var(--amber);
    margin-left: auto; padding: 4px 8px; border: 1px solid var(--amber-deep);
    border-radius: 5px; background: rgba(255,176,32,.06); white-space: nowrap;
  }

  /* ---- IN / OUT mode switch (signal lights) ---- */
  .modes { display: flex; gap: 10px; margin-bottom: 16px; }
  .modes button {
    flex: 1; padding: 16px 12px; font-size: 15px; font-weight: 800; letter-spacing: .03em;
    text-transform: uppercase; border: 1.5px solid var(--line);
    border-radius: var(--radius); background: var(--card); color: var(--muted);
    cursor: pointer; position: relative; transition: transform .12s, box-shadow .2s, border-color .2s, color .2s;
  }
  .modes button:active { transform: scale(.97); }
  .modes button.active-in {
    border-color: var(--in); color: #eafff2;
    background: linear-gradient(180deg, rgba(31,211,106,.18), rgba(13,94,48,.22));
    box-shadow: 0 0 0 1px var(--in) inset, 0 8px 26px -8px var(--in-glow);
  }
  .modes button.active-out {
    border-color: var(--out); color: #fff0ef;
    background: linear-gradient(180deg, rgba(255,82,71,.18), rgba(126,32,28,.24));
    box-shadow: 0 0 0 1px var(--out) inset, 0 8px 26px -8px var(--out-glow);
  }

  /* ---- Cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 16px; margin-bottom: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -28px rgba(0,0,0,.9);
  }

  /* ---- Labels & fields ---- */
  label {
    display: block; font-family: 'Space Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); margin: 14px 0 6px;
  }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%; padding: 14px 13px; font-size: 17px;
    font-family: 'Space Mono', monospace; font-weight: 700;
    border-radius: 11px; border: 1.5px solid var(--line);
    background: var(--bg2); color: var(--text);
    transition: border-color .15s, box-shadow .15s; appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
    padding-right: 34px; cursor: pointer;
  }
  input::placeholder { color: var(--faint); font-weight: 400; }
  input:focus, select:focus {
    outline: none; border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(255,176,32,.18);
  }
  .row { display: flex; gap: 11px; }
  .row > * { flex: 1; }
  .scanbar { display: flex; gap: 9px; align-items: flex-end; }
  .scanbar > div { flex: 1; }
  .iconbtn {
    padding: 14px 15px; border-radius: 11px; border: 1.5px solid var(--line2);
    background: var(--card2); color: var(--text); font-size: 15px; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s;
  }
  .iconbtn:active { background: var(--line); }
  .iconbtn:hover { border-color: var(--amber); }

  /* ---- Submit (the action commit) ---- */
  #submit {
    width: 100%; padding: 18px; font-size: 18px; font-weight: 900;
    letter-spacing: .05em; text-transform: uppercase; border: none;
    border-radius: 12px; color: #fff; cursor: pointer; margin-top: 16px;
    transition: transform .12s, box-shadow .2s, filter .15s;
  }
  #submit:active { transform: translateY(1px); }
  #submit.in  {
    background: linear-gradient(180deg, var(--in), #14a350);
    color: #042d16; box-shadow: 0 10px 30px -10px var(--in-glow), 0 0 0 1px rgba(255,255,255,.12) inset;
  }
  #submit.out {
    background: linear-gradient(180deg, var(--out), #d83a30);
    box-shadow: 0 10px 30px -10px var(--out-glow), 0 0 0 1px rgba(255,255,255,.14) inset;
  }
  #submit:disabled { opacity: .45; filter: saturate(.4); cursor: default; }

  #camWrap { display: none; margin-top: 14px; }
  #video {
    width: 100%; border-radius: 12px; background: #000;
    border: 1.5px solid var(--line2); box-shadow: 0 0 0 1px var(--amber-deep);
  }
  .hint {
    font-family: 'Space Mono', monospace; font-size: 11.5px; line-height: 1.5;
    color: var(--muted); margin-top: 8px;
  }

  /* ---- Toast (status readout) ---- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px);
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px;
    background: #f3f6fa; color: #0c0f14; padding: 13px 20px; border-radius: 11px;
    box-shadow: 0 10px 40px rgba(0,0,0,.55); opacity: 0;
    transition: opacity .22s, transform .22s; pointer-events: none;
    max-width: 92%; text-align: center; border: 1px solid rgba(0,0,0,.15);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok  {
    background: linear-gradient(180deg, #1fd36a, #14a350); color: #042d16;
    box-shadow: 0 10px 40px -6px var(--in-glow);
  }
  .toast.err {
    background: linear-gradient(180deg, #ff5247, #d83a30); color: #fff;
    box-shadow: 0 10px 40px -6px var(--out-glow);
  }

  /* ---- Current stock (manifest) ---- */
  details {
    margin-top: 4px; background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  }
  summary {
    cursor: pointer; color: var(--text); font-weight: 800; font-size: 14px;
    letter-spacing: .02em; list-style: none; display: flex; align-items: center; gap: 8px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '▸'; margin-left: auto; color: var(--amber); transition: transform .2s; }
  details[open] summary::after { transform: rotate(90deg); }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  th {
    font-family: 'Space Mono', monospace; color: var(--faint);
    font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  }
  td { font-family: 'Space Mono', monospace; color: var(--text); }
  td.qty {
    text-align: right; font-variant-numeric: tabular-nums; font-weight: 700;
    color: var(--in); font-size: 15px;
  }
  tr:last-child td { border-bottom: none; }
  .low { color: var(--out) !important; }

  /* ---- States ---- */
  .setup-needed {
    background: linear-gradient(180deg, rgba(255,82,71,.16), rgba(126,32,28,.2));
    border: 1px solid var(--out); color: #ffe3e1; padding: 13px 14px;
    border-radius: 11px; margin-bottom: 14px; font-size: 13.5px; line-height: 1.55;
  }
  label.nobc {
    display: flex; align-items: center; gap: 11px; font-family: 'Archivo', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none;
    color: var(--text); margin: 0 0 6px; padding: 12px 13px; cursor: pointer;
    background: var(--bg2); border: 1.5px solid var(--line); border-radius: 11px;
    transition: border-color .15s;
  }
  label.nobc:hover { border-color: var(--amber); }
  label.nobc input {
    width: 20px; height: 20px; flex: none; accent-color: var(--amber); cursor: pointer;
  }

  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  h1, .modes, .card, details { animation: riseIn .5s cubic-bezier(.2,.7,.3,1) backwards; }
  .modes { animation-delay: .05s; }
  .card  { animation-delay: .1s; }
  details { animation-delay: .15s; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>

<script>
  const API_URL   = 'https://script.google.com/macros/s/AKfycbysxwCXl5vokxIeYJ1xzTFCaT4Kb5Cp3T1ggMBdbbiqNnPaDHg0G0gfA_EFeALKDtKA/exec';
  const API_TOKEN = '2002116'; // must match Code.gs
</script>

<h1>📦 Warehouse Stock</h1>

<div id="setupWarn" class="setup-needed" style="display:none">
  ⚠️ Not configured yet. Open this file and set <b>API_URL</b> and <b>API_TOKEN</b> (see SETUP.md).
</div>

<div class="modes">
  <button id="modeIn"  class="active-in"  onclick="setMode('IN')">⬇️ Stock IN</button>
  <button id="modeOut" onclick="setMode('OUT')">⬆️ Stock OUT</button>
</div>

<div class="card">
  <label class="nobc">
    <input type="checkbox" id="noBarcode" onchange="toggleNoBarcode()" />
    This product has no barcode
  </label>

  <!-- Barcode mode -->
  <div id="bcWrap">
    <label>Barcode</label>
    <div class="scanbar">
      <div>
        <input id="barcode" inputmode="numeric" autocomplete="off"
               placeholder="Scan or type, then Enter" />
      </div>
      <button class="iconbtn" id="camBtn" onclick="toggleCam()">📷 Camera</button>
    </div>
    <div id="camWrap"><video id="video" playsinline muted></video>
      <div class="hint">Point the camera at the barcode. It fills in automatically.</div>
    </div>
  </div>

  <!-- No-barcode mode: pick a known item or add a new one -->
  <div id="pickWrap" style="display:none">
    <label>Item (pick existing, or choose “➕ New item…”)</label>
    <select id="itemPicker" onchange="onPickItem()"></select>
  </div>

  <label>Item name</label>
  <input id="name" placeholder="Auto-fills for known items; type for new ones" autocomplete="off" />
  <div class="hint" id="nameHint"></div>

  <label>Packaging / unit</label>
  <select id="unit"></select>

  <div class="row">
    <div>
      <label>Quantity</label>
      <input id="qty" inputmode="numeric" type="number" min="1" step="1" placeholder="e.g. 24" />
    </div>
    <div>
      <label>Warehouse</label>
      <select id="warehouse"></select>
    </div>
  </div>

  <div id="destWrap" style="display:none">
    <label>Destination (where it's going)</label>
    <select id="destination"></select>
  </div>

  <button id="submit" class="in" onclick="submit()">Record Stock IN</button>
</div>

<details>
  <summary>📊 Current stock</summary>
  <table id="stockTable"><thead>
    <tr><th>Item</th><th>Unit</th><th>Warehouse</th><th class="qty">On hand</th></tr>
  </thead><tbody></tbody></table>
  <div class="hint">Tap “Current stock” again to refresh after a scan.</div>
</details>

<div class="toast" id="toast"></div>

<!-- Barcode scanning library (camera). Loaded from CDN; the typed/hardware path works without it. -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
let MODE = 'IN';
let lastSubmit = 0;

const $ = id => document.getElementById(id);

function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = 'toast'; }, 2600);
}

function setMode(mode) {
  MODE = mode;
  const inB = $('modeIn'), outB = $('modeOut'), sub = $('submit');
  inB.className  = mode === 'IN'  ? 'active-in'  : '';
  outB.className = mode === 'OUT' ? 'active-out' : '';
  $('destWrap').style.display = mode === 'OUT' ? 'block' : 'none';
  sub.className = mode === 'IN' ? 'in' : 'out';
  sub.textContent = 'Record Stock ' + mode;
}

// ---- talk to Apps Script ----
async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    // text/plain avoids a CORS preflight that Apps Script can't answer.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: API_TOKEN, ...payload })
  });
  return res.json();
}

async function bootstrap() {
  if (API_URL.startsWith('PASTE_')) { $('setupWarn').style.display = 'block'; return; }
  try {
    const data = await api({ action: 'bootstrap' });
    if (!data.ok) { toast(data.error || 'Load failed', 'err'); return; }
    fillSelect($('warehouse'), data.warehouses);
    fillSelect($('destination'), data.destinations);
    fillSelect($('unit'), (data.units && data.units.length) ? data.units : ['Single']);
    KNOWN_ITEMS = data.items || [];
    fillItemPicker();
    renderStock(data.stock);
  } catch (e) { toast('Cannot reach the sheet. Check API_URL.', 'err'); }
}

let KNOWN_ITEMS = [];

// Fills the no-barcode picker: every known item plus a "New item…" option.
function fillItemPicker() {
  const sel = $('itemPicker');
  sel.innerHTML = '';
  const add = (val, label) => {
    const o = document.createElement('option'); o.value = val; o.textContent = label; sel.appendChild(o);
  };
  add('__new__', '➕ New item…');
  KNOWN_ITEMS.forEach(it => add(it.name, it.name));
}

// Switches between barcode and no-barcode input modes.
function toggleNoBarcode() {
  const off = $('noBarcode').checked;
  $('bcWrap').style.display = off ? 'none' : 'block';
  $('pickWrap').style.display = off ? 'block' : 'none';
  if (off) {
    stopCam();
    $('barcode').value = '';
    onPickItem();              // sync the name box to the current pick
  } else {
    $('name').value = '';
    $('nameHint').textContent = '';
  }
}

// When a known item is picked, fill the name; "New item…" clears it for typing.
function onPickItem() {
  const v = $('itemPicker').value;
  if (v === '__new__') {
    $('name').value = '';
    $('nameHint').textContent = 'Type the new item name, then set quantity.';
    $('name').focus();
  } else {
    $('name').value = v;
    $('nameHint').textContent = '✓ Known item (no barcode)';
    $('qty').focus();
  }
}

function fillSelect(sel, items) {
  sel.innerHTML = '';
  (items || []).forEach(v => {
    const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
  });
}

function renderStock(rows) {
  const body = $('stockTable').querySelector('tbody');
  body.innerHTML = '';
  (rows || []).forEach(r => {
    const tr = document.createElement('tr');
    const low = r.qty <= 0 ? ' low' : '';
    tr.innerHTML = `<td>${esc(r.name)}</td><td>${esc(r.unit || 'Single')}</td>` +
                   `<td>${esc(r.warehouse)}</td>` +
                   `<td class="qty${low}">${r.qty}</td>`;
    body.appendChild(tr);
  });
}
function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

// ---- barcode lookup (after a scan or typing + Enter) ----
let lookupTimer;
async function onBarcode() {
  const code = $('barcode').value.trim();
  if (!code) return;
  $('nameHint').textContent = 'Looking up…';
  try {
    const r = await api({ action: 'lookup', barcode: code });
    if (r.ok && r.known) {
      $('name').value = r.name;
      $('nameHint').textContent = '✓ Known item';
      $('qty').focus();
      return;
    }
  } catch (e) { /* fall through to global lookup */ }

  // Not in your Items tab — try the free Open Food Facts global database.
  $('nameHint').textContent = 'New barcode — checking product database…';
  const globalName = await lookupOpenFoodFacts(code);
  if (globalName) {
    $('name').value = globalName;
    $('nameHint').textContent = '🌐 Found online — check the name, then save (it’ll be remembered).';
  } else {
    $('nameHint').textContent = 'New barcode — type a name to register it.';
    $('name').focus();
  }
  $('qty').focus();
}

// Looks a barcode up in Open Food Facts (free, no key) and builds a DESCRIPTIVE
// name including brand + product + size + can/bottle when available.
// e.g. "Coca-Cola Original Taste 33cl Can". Returns '' if not found.
async function lookupOpenFoodFacts(code) {
  try {
    const res = await fetch(
      `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json` +
      `?fields=product_name,product_name_en,product_name_fr,brands,quantity,` +
      `product_quantity,product_quantity_unit,packaging`,
      { headers: { 'Accept': 'application/json' } }
    );
    if (!res.ok) return '';
    const data = await res.json();
    if (data.status !== 1 || !data.product) return '';
    const p = data.product;

    let name = String(p.product_name_en || p.product_name || p.product_name_fr || '').trim();
    if (!name) return '';

    // Prefix the brand if it isn't already part of the name.
    const brand = (p.brands || '').split(',')[0].trim();
    if (brand && !name.toLowerCase().includes(brand.toLowerCase())) name = brand + ' ' + name;

    // Append the size (e.g. "33cl", "1L") if it's not already in the name.
    const size = formatSize(p);
    if (size && !name.toLowerCase().replace(/\s/g, '').includes(size.toLowerCase().replace(/\s/g, ''))) {
      name += ' ' + size;
    }

    // Append the container type (Can / Bottle) when the packaging field makes it clear.
    const container = detectContainer(p.packaging);
    if (container && !name.toLowerCase().includes(container.toLowerCase())) name += ' ' + container;

    return name.replace(/\s+/g, ' ').trim();
  } catch (e) { return ''; }
}

// Builds a clean size label from the structured fields, falling back to the raw text.
function formatSize(p) {
  const ml = Number(p.product_quantity);
  const unit = String(p.product_quantity_unit || '').toLowerCase();
  if (ml > 0 && (unit === 'ml' || unit === 'g' || !unit)) {
    if (unit !== 'g' && ml >= 1000 && ml % 100 === 0) return (ml / 1000) + 'L';   // 1000 -> 1L
    if (unit !== 'g' && ml % 10 === 0 && ml < 1000)   return (ml / 10) + 'cl';     // 330  -> 33cl
    return ml + (unit || 'ml');
  }
  // Fall back to the human "quantity" string, tidied up ("33 cl" -> "33cl").
  const q = String(p.quantity || '').trim().replace(/\s+/g, '');
  return q || '';
}

// Best-effort can/bottle detection from the messy, multilingual packaging field.
function detectContainer(packaging) {
  const s = String(packaging || '').toLowerCase();
  if (!s) return '';
  if (/\bcan\b|canette|lata|lattina|dose|drink can/.test(s)) return 'Can';
  if (/bottle|bouteille|botella|bottiglia|pet|garrafa/.test(s)) return 'Bottle';
  return '';
}

$('barcode').addEventListener('keydown', e => {
  // Hardware scanners send the barcode then an Enter keystroke.
  if (e.key === 'Enter') { e.preventDefault(); onBarcode(); }
});
$('barcode').addEventListener('blur', onBarcode);

// ---- camera scanning ----
let codeReader, scanning = false;
async function toggleCam() {
  if (scanning) { stopCam(); return; }
  if (!window.ZXing) { toast('Camera library not loaded (no internet?)', 'err'); return; }
  try {
    codeReader = new ZXing.BrowserMultiFormatReader();
    $('camWrap').style.display = 'block';
    $('camBtn').textContent = '✕ Close';
    scanning = true;
    await codeReader.decodeFromVideoDevice(null, 'video', (result) => {
      if (result) {
        $('barcode').value = result.getText();
        if (navigator.vibrate) navigator.vibrate(60);
        stopCam();
        onBarcode();
      }
    });
  } catch (e) { toast('Camera unavailable. Use a scanner or type.', 'err'); stopCam(); }
}
function stopCam() {
  scanning = false;
  if (codeReader) { try { codeReader.reset(); } catch (e) {} }
  $('camWrap').style.display = 'none';
  $('camBtn').textContent = '📷 Camera';
}

// ---- submit ----
async function submit() {
  if (Date.now() - lastSubmit < 800) return; // guard against double-tap / double-scan
  const noBarcode = $('noBarcode').checked;
  const name = $('name').value.trim();
  const unit = $('unit').value || 'Single';
  const qty = Number($('qty').value);
  const warehouse = $('warehouse').value;
  const destination = $('destination').value;

  // For no-barcode items, the stable key is the name itself (prefixed so it never
  // collides with a real numeric barcode), so repeat entries sum together.
  const barcode = noBarcode ? ('NB:' + name.toLowerCase()) : $('barcode').value.trim();

  if (noBarcode) {
    if (!name) return toast('Enter or pick an item name.', 'err');
  } else {
    if (!barcode) return toast('Scan or enter a barcode.', 'err');
  }
  if (!qty || qty <= 0) return toast('Enter a quantity.', 'err');
  if (!warehouse) return toast('Pick a warehouse.', 'err');
  if (MODE === 'OUT' && !destination) return toast('Pick a destination.', 'err');

  lastSubmit = Date.now();
  $('submit').disabled = true;
  try {
    const r = await api({ action: 'record', type: MODE, barcode, name, unit, quantity: qty, warehouse, destination });
    if (r.ok) {
      toast(`${MODE === 'IN' ? '＋' : '－'}${qty} ${r.name} (${r.unit}) → ${r.onHand} on hand`, 'ok');
      if (navigator.vibrate) navigator.vibrate(40);
      // Remember a new no-barcode item locally so it appears in the picker right away.
      if (noBarcode && !KNOWN_ITEMS.some(it => it.name.toLowerCase() === name.toLowerCase())) {
        KNOWN_ITEMS.push({ barcode: barcode, name: name });
        KNOWN_ITEMS.sort((a, b) => a.name.localeCompare(b.name));
        fillItemPicker();
      }
      // Reset for the next entry; keep warehouse + no-barcode mode for speed.
      $('barcode').value = ''; $('qty').value = '';
      if (noBarcode) { $('itemPicker').value = '__new__'; $('name').value = ''; }
      else { $('name').value = ''; $('barcode').focus(); }
      $('nameHint').textContent = '';
    } else {
      toast(r.error || 'Failed to record.', 'err');
    }
  } catch (e) {
    toast('Network error — not recorded. Try again.', 'err');
  } finally {
    $('submit').disabled = false;
  }
}

// Refresh stock when the section is opened.
document.querySelector('details').addEventListener('toggle', e => { if (e.target.open) bootstrap(); });

setMode('IN');
bootstrap();
</script>
</body>
</html>
